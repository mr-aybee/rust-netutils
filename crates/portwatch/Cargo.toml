[package]
name = "portwatch"
version = "0.1.0"
description = "Inspect and watch TCP/UDP sockets, listening ports and owning processes"
readme = "README.md"
keywords = ["netstat", "ports", "sockets", "network", "ss"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
net-common = { version = "0.1.0", path = "../net-common" }
netstat2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
