[package]
name = "netprobe"
version = "0.1.0"
description = "Multi-protocol network diagnostics: TCP, DNS, HTTP(S), UDP and ICMP probes with timing breakdowns and JSON output"
readme = "README.md"
keywords = ["network", "diagnostics", "dns", "http", "ping"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
net-common = { version = "0.1.0", path = "../net-common" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
predicates = "3.1.4"
proptest = "1.11.0"
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"

[[bench]]
name = "core"
harness = false
