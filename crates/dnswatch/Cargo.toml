[package]
name = "dnswatch"
version = "0.1.0"
description = "DNS record change monitoring, propagation waiting and multi-resolver comparison"
readme = "README.md"
keywords = ["dns", "monitoring", "propagation", "resolver", "diff"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
net-common = { version = "0.1.0", path = "../net-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "signal", "sync"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
serde_json = "1.0.154"
