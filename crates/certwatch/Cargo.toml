[package]
name = "certwatch"
version = "0.1.0"
description = "TLS certificate inspection and expiry monitoring with chain validation, batch checks and CI-friendly exit codes"
readme = "README.md"
keywords = ["tls", "certificate", "x509", "expiry", "monitoring"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
net-common = { version = "0.1.0", path = "../net-common" }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "signal", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
rcgen = "0.14.10"
serde_json = "1.0.154"
time = "0.3.55"
